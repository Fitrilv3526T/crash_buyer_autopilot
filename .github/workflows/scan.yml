name: crash-buyer scan
on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run scanner
        run: node scanner/run.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save results to the repo
        run: |
          git config user.name "crash-buyer-bot"
          git config user.email "crash-buyer-bot@users.noreply.github.com"
          git add config.json docs/data
          if git diff --cached --quiet; then echo "nothing to save"; else git commit -m "scan $(date -u +'%Y-%m-%d %H:%M')" && git pull --rebase -q && git push; fi
      - name: Keep the schedule alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable scan.yml
